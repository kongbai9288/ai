# Fabric Properties
# 版本基线来源: https://fabricmc.net/develop (26.2)
minecraft_version=26.2
# 编译用「最低支持版本」：这样产出的 mod 能在 0.19.3 及以上的任何 loader 上跑。
# 实测用户环境是 0.19.3（能正常运行 26.2），把门槛设在 0.19.5 会不必要地拒绝加载。
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.160.0+26.2

# Carpet 核心依赖
# 走 Modrinth Maven: maven.modrinth:carpet:<version>
# 26.2 是 Carpet 对应 MC 26.2 的正式版版本号
# (不要写成 26.2+v260621, Modrinth Maven 上只有发布版本号)
carpet_core_version=26.2

# Mod Properties
mod_version = 0.1.0-m1
maven_group = com.kongbai
archives_base_name = ai-agent

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ 对 configuration cache 支持尚不完整
org.gradle.configuration-cache=false
