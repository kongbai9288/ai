plugins {
    // 26.1 起 Minecraft 不再混淆，Loom 的插件 id 随之改为 net.fabricmc.fabric-loom
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Carpet：优先走 Modrinth Maven（官方发布渠道，版本号确定）
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
    // 备用：Carpet 作者自建仓库
    maven { url 'https://masa.dy.fi/maven' }
    mavenCentral()
}

loom {
    // 本项目无客户端专属代码，不做环境拆分。
    // 一旦启用 splitEnvironmentSourceSets，就必须存在 src/client 目录，
    // 否则 Loom 会在配置阶段报错。
    //
    // 26.1 起没有 intermediary 中间命名空间，源码 jar 无法（也无需）重映射。
    noIntermediateMappings()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.1 起 MC 未混淆：不再声明 mappings。
    // 保留官方命名（如 net.minecraft.commands.CommandSourceStack），与运行时一致。

    // 26.1 起不再使用 modImplementation / modCompileOnly，改用标准配置
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Carpet 核心：编译期依赖，运行时由玩家自行安装。
    // 坐标用 Modrinth Maven 的 maven.modrinth:<slug>:<version>，
    // 不用 carpet:fabric-carpet（该坐标在 masa 仓库上的版本命名不稳定，易解析失败）。
    compileOnly "maven.modrinth:carpet:${carpet_core_version}"

    // GSON 与 java.net.http.HttpClient 均由 Minecraft / JDK 自带，无需额外引入
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    // MC 26.1+ 要求 Java 25
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // 不生成 sourcesJar：26.1 起无 intermediary 命名空间，remapSourcesJar 无法工作
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}
