plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Carpet 官方 Maven（必需）
    maven { url 'https://masa.dy.fi/maven' }
    mavenCentral()
}

loom {
    // 本项目无客户端专属代码，不做环境拆分。
    // 一旦启用 splitEnvironmentSourceSets，就必须存在 src/client 目录，
    // 否则 Loom 会在配置阶段报错。
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Carpet 核心：编译期依赖，运行时由玩家自行安装
    modCompileOnly "carpet:fabric-carpet:${minecraft_version}-${carpet_core_version}"

    // GSON 与 java.net.http.HttpClient 均由 Minecraft / JDK 自带，无需额外引入
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    // MC 26.1+ 要求 Java 25
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}
